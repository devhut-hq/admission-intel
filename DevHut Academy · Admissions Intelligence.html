<style>
:root{--bg:#f5f7fb;--cd:#fff;--tx:#101828;--mu:#5d6b82;--pr:#1352a1;--bd:#e1e7f0;--so:#eaf1fb;--ok:#137a4b;--wn:#a86400;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--cd:#131d31;--tx:#e8eefb;--mu:#98a8c6;--pr:#6aa5ff;--bd:#25344f;--so:#1a2943;--ok:#4cc38a;--wn:#f0b45a;--er:#ff8a80}}
:root[data-theme="dark"]{--bg:#0b1220;--cd:#131d31;--tx:#e8eefb;--mu:#98a8c6;--pr:#6aa5ff;--bd:#25344f;--so:#1a2943;--ok:#4cc38a;--wn:#f0b45a;--er:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.side{position:fixed;inset:0 auto 0 0;width:216px;background:var(--cd);border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:6px}
.logo{background:#fff;border-radius:10px;padding:8px;margin-bottom:10px}.logo img{width:100%;display:block}
.side button.n{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--mu);font-weight:600}
.side button.n:hover,.side button.n.on{background:var(--so);color:var(--pr)}.side button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,tr:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
.foot{margin-top:auto;font-size:12px;color:var(--mu)}
main{margin-left:216px;padding:20px;max-width:1180px}h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:0 0 10px}.mu{color:var(--mu)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px}.g>.card{margin:0}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.k div{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}.k b{font-size:24px;color:var(--pr);display:block}.k span{font-size:12px;color:var(--mu)}
.drop{display:block;border:2px dashed var(--pr);border-radius:12px;padding:30px;text-align:center;cursor:pointer;background:var(--cd)}.drop.on{background:var(--so)}
button,.bt{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}.al{background:var(--so);color:var(--pr)}
input,select{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);font:inherit}
.br{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:5px 0}.br span{width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.br i{flex:1;height:8px;background:var(--so);border-radius:8px;overflow:hidden}.br b{display:block;height:100%;background:var(--pr)}.br em{width:50px;text-align:right;font-style:normal}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd)}th{font-size:12px;color:var(--mu)}tbody tr{cursor:pointer}tbody tr:hover{background:var(--so)}
.bd{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--so);color:var(--pr)}.Hot,.Low{color:var(--er)}.Warm,.Medium{color:var(--wn)}.Cold{color:var(--pr)}.High{color:var(--ok)}
.ban{background:#fdecc8;color:#5f4100;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-weight:600}.er{background:#fde3e0;color:#7a1710;padding:12px;border-radius:8px;margin-top:10px}.hide{display:none}
textarea{width:100%;min-height:210px;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
ul{margin:6px 0;padding-left:18px}.tw{overflow-x:auto}
@media(max-width:760px){.side{inset:auto 0 0 0;width:auto;flex-direction:row;padding:6px;overflow-x:auto;z-index:9;border-top:1px solid var(--bd);border-right:0}.logo,.foot{display:none}main{margin:0;padding:14px 14px 80px}}
@media print{.side,.noprint{display:none!important}main{margin:0;max-width:none}body{background:#fff;color:#000}}
</style></head><body>

function evalRow(r){

 Q.forEach(q=>{const v=g(q.k);if(!cols[q.k])return;if(!v){miss++;return}if(q.apt)ap[q.k]=0;
  (q.t==='m'?v.split(/,\s*/):[v]).forEach(it=>{const o=q.map.find(x=>x.lc===it.toLowerCase().trim());
   if(!o){if(q.other&&!/^none of these/i.test(it))t.R++;return}
   if(q.apt)ap[q.k]=1;
   o.t.forEach(k=>{if(k.startsWith('F:')){fl.push(k.slice(2));return}const m=k.match(/^([A-Z]+)(\d+)$/);if(!m)return;const n=+m[2];
    if(m[1] in s){s[m[1]]+=n;ct[m[1]].push([q.apt?'good instincts in our warm-up questions':o.l,n])}else t[m[1]]+=n})})});
 const pct={};K.forEach(c=>pct[c]=Math.max(4,Math.min(97,Math.round(s[c]/(CAP[c]*S.scale)*100))));
 const rank=K.slice().sort((a,b)=>s[b]-s[a]||pct[b]-pct[a]),top=rank[0];
 const idx=t.R+t.A*2,level=idx<8?'Beginner':idx<20?'Early':idx<36?'Intermediate':'Advanced';
 const eng=t.C+t.P;let lead=eng>=S.hot?'Hot':eng>=S.warm?'Warm':'Cold';if(fl.includes('needsponsor')&&lead==='Hot')lead='Warm';
 const why=[];ct[top].sort((a,b)=>b[1]-a[1]).forEach(x=>{if(!why.includes(x[0]))why.push(x[0])});
 const iss=[],em=g('email address'),ph=g('phone');
 if(!/^\S+@\S+\.\S+$/.test(em))iss.push('Invalid email');if(ph.replace(/\D/g,'').length<8)iss.push('Invalid phone');if(miss>3)iss.push(miss+' unanswered');

 if(/^no/i.test(g('written code'))&&nl>=3)iss.push('Says no coding but lists '+nl+' tools');
 if(/^no/i.test(g('laptop'))&&/more than 20/i.test(g('hours per week')))iss.push('No laptop but 20+ hrs/week');
 const pw=g('prefer to work').toLowerCase(),first=g('first name')||'This student';
 const style=pw.includes('alone')?'prefers focused, independent work':pw.includes('small team')?'enjoys collaborating in small teams':pw.includes('leading')?'shows natural leadership instincts':'has a flexible working style';
 const pay=g('prefer to pay');
 return{name:(first+' '+g('last name')).trim(),first,email:em,ph,age:g('age range'),city:g('city and country').split(',')[0].trim(),school:g('secondary school'),inst:g('university'),field:g('what did you study'),chan:g('hear about'),goal:g('main goal'),own:g('course interests'),
  s,pct,rank,top,second:rank[1],level,lead,fl,why:why.slice(0,4),ap,apt:t.A,iss,close:pct[top]-pct[rank[1]]<=5,
  payc:/sponsor/i.test(pay)?'sponsor':/instal/i.test(pay)?'instal':/full/i.test(pay)?'full':'unsure',
  desc:`${first} comes across as a ${LB[top]}: ${TR[top]}. ${first} ${style} and ${RD[level]}.`}}

 <div class="card"><h2>30 / 60 / 90-day path</h2><ul>${x.level==='Beginner'?'<li>Before day 1: two weeks of computer basics and intro logic</li>':''}${PL[x.top].map((p,j)=>`<li><b>Days ${j*30+1}-${j*30+30}:</b> ${p}</li>`).join('')}</ul>
 <h2>Counsellor call guide</h2><ul><li>Confirm their goal: ${esc(x.goal||'ask what they want')}</li><li>${x.own&&x.own!==N[x.top]?`They picked ${esc(x.own)}; explain why ${N[x.top]} also suits them`:`Explain why ${N[x.top]} suits them`}</li><li>${x.fl.includes('needsponsor')?'Offer instalment or sponsorship options':x.fl.includes('nolaptop')?'Discuss laptop options':'Agree a start date and payment'}</li></ul></div>
 <div class="card noprint"><h2>Email draft</h2><select id="vr">${[['offer','Best-fit offer'],['prep','Beginner invite'],['plan','Payment plan'],['nudge','7-day nudge']].map(a=>`<option value="${a[0]}"${a[0]===x.vr?' selected':''}>${a[1]}</option>`).join('')}</select><textarea id="mb">${esc(m.body)}</textarea><div id="ms" class="mu">Subject: ${esc(m.sub)}</div><button id="cp">Copy email</button> <a class="bt al" id="ml" href="#">Open in mail app</a></div></div>`;
 const up=()=>{const mm=mail(x,$('vr').value);$('mb').value=mm.body;$('ms').textContent='Subject: '+mm.sub;$('ml').href='mailto:'+encodeURIComponent(x.email)+'?subject='+encodeURIComponent(mm.sub)+'&body='+encodeURIComponent(mm.body)};
 $('vr').onchange=up;up();$('cp').onclick=e=>{$('mb').select();try{navigator.clipboard.writeText($('mb').value)}catch(_){document.execCommand('copy')}e.target.textContent='Copied!';setTimeout(()=>e.target.textContent='Copy email',1400)};show('profile')}

function outr(){
 const D=use(),v=cnt(D.map(x=>x.vr));
 $('v-outreach').innerHTML=`<h1>Outreach</h1><p class="mu">Each student gets the email variant that suits them. Student emails never include scores or flags.</p><div class="card"><h2>Variants assigned</h2>${bars(v.map(a=>[{offer:'Best-fit offer',prep:'Beginner invite',plan:'Payment plan'}[a[0]]||a[0],a[1]]))}<p><button id="ex">Download mail-merge CSV</button></p></div>`;
 $('ex').onclick=()=>{const q=s=>'"'+String(s).replace(/"/g,'""')+'"',rows=[['Name','Email','Subject','Body']].concat(D.map(x=>{const m=mail(x,x.vr);return[x.name,x.email,m.sub,m.body]}));
  dl('devhut-mailmerge.csv',rows.map(r=>r.map(q).join(',')).join('\n'))}}
function dl(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=n;a.click()}

function meth(){
 $('v-method').innerHTML=`<h1>Methodology</h1><div class="card"><h2>Settings</h2><p>Match scale <input id="s1" type="number" step=".05" min=".2" max="1" value="${S.scale}" style="width:80px"> Hot at <input id="s2" type="number" value="${S.hot}" style="width:70px"> Warm at <input id="s3" type="number" value="${S.warm}" style="width:70px"> <button id="rc">Recalculate</button> <button class="al" id="rs">Reset</button></p></div>
 <div class="card"><h2>How scores work</h2><ul><li><b>Course points:</b> each answer adds points to courses (table below). Course match % = points ÷ (maximum realistic points × scale), clamped to 4–97%. Lower scale = higher percentages.</li><li><b>Readiness:</b> prior-experience points + 2 × warm-up correct. Under 8 Beginner, under 20 Early, under 36 Intermediate, else Advanced.</li><li><b>Lead:</b> commitment (goal, hours, laptop, status) + payment points. Hot at or above the Hot setting, Warm at or above Warm. Needing sponsorship caps Hot at Warm.</li><li><b>Close call:</b> top two matches within 5 points.</li><li><b>Data confidence:</b> High = no issues, Medium = 1, Low = 2+. Checks: invalid email/phone, over 3 unanswered, duplicates, contradictions.</li><li>Beginners are never penalised; they get preparation steps. Percentages guide counselling and are not a verdict.</li></ul></div>
 <div class="card"><details><summary><b>Full scoring table</b></summary><div class="tw"><table><thead><tr><th>Question</th><th>Answer</th><th>Points</th></tr></thead><tbody>${Q.flatMap(q=>q.map.map(o=>`<tr><td>${esc(q.k)}</td><td>${esc(o.l)}</td><td>${esc(o.t.join(', '))}</td></tr>`)).join('')}</tbody></table></div></details></div>`;
 $('rc').onclick=()=>{S.scale=+$('s1').value||.5;S.hot=+$('s2').value;S.warm=+$('s3').value;if(RAW.length){run();analytics();list();outr()}};
 $('rs').onclick=()=>{S.scale=.5;S.hot=8;S.warm=5;meth();if(RAW.length){run();analytics();list();outr()}}}

function mkDemo(){
 const F=['Ada','Tunde','Chioma','Ibrahim','Zainab','Emeka','Fatima','Seun','Ngozi','Kola','Amaka','Yusuf'],L=['Okafor','Bello','Adeyemi','Nwosu','Musa','Eze','Balogun','Ojo'],SC=['Kings College','Queens College','Federal Govt College','Command Secondary','Lagos Model College'],rnd=a=>a[Math.floor(Math.random()*a.length)];
 return Array.from({length:40},(_,i)=>{const r={},f=rnd(F),l=rnd(L);
  r['first name']=f;r['last name']=l;r['email address']=i===3?'not-an-email':i===9?'dup@mail.com':i===10?'dup@mail.com':`${f}.${l}${i}@mail.com`.toLowerCase();r['phone']=i===5?'123':'+23480'+String(10000000+Math.floor(Math.random()*8e7));
  r['age range']=rnd(['16 – 18','19 – 24','25 – 34','35 and above']);r['city and country']=rnd(['Lagos, Nigeria','Abuja, Nigeria','Ibadan, Nigeria']);r['secondary school']=rnd(SC);r['university']=Math.random()<.5?rnd(['UNILAG','Yaba College of Tech','Covenant University']):'';r['hear about']=rnd(['Instagram','TikTok','A friend or family member','Google','WhatsApp']);
  Q.forEach(q=>{const nb=Math.random()<.22;r[q.k]=q.t==='m'?q.map.filter(()=>Math.random()<.25).map(o=>o.l).join(', '):nb?rnd(['No',"I don't know",'Other']):rnd(q.map).l});return r})}

$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array'}),nm=wb.SheetNames.find(n=>/form responses/i.test(n))||wb.SheetNames[0],rows=XLSX.utils.sheet_to_json(wb.Sheets[nm],{defval:''});
 rows.length?load(rows,false):fail('That sheet has no rows.')}catch(err){fail('Could not read that file: '+err.message)}};rd.readAsArrayBuffer(f)};
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('on')};$('drop').ondragleave=()=>$('drop').classList.remove('on');
$('drop').ondrop=e=>{e.preventDefault();$('file').files=e.dataTransfer.files;$('file').onchange({target:$('file')})};
$('dm').onclick=()=>load(mkDemo(),true);
document.querySelectorAll('.side .n').forEach(b=>b.onclick=()=>show(b.dataset.v));
$('th').onclick=()=>{const d=document.documentElement,dk=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;d.dataset.theme=dk?'light':'dark'};
meth();
</script></body></html>
